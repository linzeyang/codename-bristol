name: shengyu

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shengyu}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 本地演示仅绑定 127.0.0.1 并使用 trust 认证；生产请改为密码认证并通过 DATABASE_URL 注入
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shengyu}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}@db:5432/${POSTGRES_DB:-shengyu}}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      API_ORIGIN: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: seed
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}@db:5432/${POSTGRES_DB:-shengyu}}
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "dist/seed-cli.js"]
    restart: "no"

volumes:
  db-data: